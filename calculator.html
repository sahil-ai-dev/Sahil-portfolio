<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hey buddy..!! | Calculator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background:
                radial-gradient(ellipse at top left, #243b48, transparent 50%),
                linear-gradient(135deg, #080b12, #151b2b, #080b12);
            color: #f5f7ff;
        }

        .calculator {
            width: 370px;
            max-width: 100%;
            padding: 25px;
            border-radius: 30px;
            background: rgba(20, 27, 41, 0.94);
            border: 1px solid #344052;
            box-shadow: 0 25px 70px #0008;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 22px;
        }

        .brand {
            font-size: 22px;
            font-weight: 750;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        .brand span {
            color: #80e8ce;
        }

        .status {
            font-size: 10px;
            letter-spacing: 1.5px;
            color: #80e8ce;
            background: #1b3637;
            padding: 8px 10px;
            border-radius: 20px;
            white-space: nowrap;
        }

        .display {
            min-height: 145px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: flex-end;
            padding: 12px 4px 25px;
            overflow: hidden;
        }

        .history {
            width: 100%;
            min-height: 25px;
            text-align: right;
            font-size: 14px;
            color: #8491a9;
            overflow-wrap: anywhere;
        }

        .result {
            width: 100%;
            text-align: right;
            font-size: clamp(30px, 8vw, 43px);
            font-weight: 500;
            letter-spacing: -1px;
            overflow-wrap: anywhere;
            color: #ffffff;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 11px;
        }

        button {
            min-width: 0;
            height: 58px;
            border: 1px solid #ffffff08;
            border-radius: 17px;
            background: #252e40;
            color: #f5f7ff;
            font-size: 19px;
            cursor: pointer;
            transition: background 0.18s, transform 0.18s;
        }

        button:active {
            transform: scale(0.94);
        }

        button:focus-visible {
            outline: 2px solid #80e8ce;
            outline-offset: 2px;
        }

        .function {
            background: #1d383a;
            color: #80e8ce;
        }

        .operator {
            background: #303750;
            color: #b8c4ff;
        }

        .delete {
            background: #412b39;
            color: #ffb4c1;
        }

        .equals {
            grid-column: span 4;
            background: linear-gradient(120deg, #80e8ce, #70c8ed);
            color: #101824;
            font-size: 21px;
            font-weight: 750;
        }

        .zero {
            grid-column: span 2;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-top: 22px;
            font-size: 10px;
            letter-spacing: 1px;
            color: #8792a8;
        }

        @media (hover: hover) {
            button:hover {
                background: #38445a;
            }

            .equals:hover {
                background: #a2f4df;
            }
        }

        @media (max-width: 390px) {
            .calculator {
                padding: 18px;
            }

            .buttons {
                gap: 8px;
            }

            button {
                height: 53px;
                border-radius: 14px;
            }
        }
    </style>
</head>

<body>

    <main class="calculator">

        <header class="header">
            <div class="brand">Hey buddy<span>..!!</span></div>
            <div class="status">● READY</div>
        </header>

        <section class="display" aria-live="polite">
            <div class="history" id="history"></div>
            <div class="result" id="result">0</div>
        </section>

        <section class="buttons">

            <button type="button" class="function" data-action="clear">AC</button>
            <button type="button" class="function" data-action="bracket">( )</button>
            <button type="button" class="function" data-action="percent">%</button>
            <button type="button" class="delete" data-action="delete">⌫</button>

            <button type="button" data-number="7">7</button>
            <button type="button" data-number="8">8</button>
            <button type="button" data-number="9">9</button>
            <button type="button" class="operator" data-operator="/">÷</button>

            <button type="button" data-number="4">4</button>
            <button type="button" data-number="5">5</button>
            <button type="button" data-number="6">6</button>
            <button type="button" class="operator" data-operator="*">×</button>

            <button type="button" data-number="1">1</button>
            <button type="button" data-number="2">2</button>
            <button type="button" data-number="3">3</button>
            <button type="button" class="operator" data-operator="-">−</button>

            <button type="button" class="function" data-action="sign">+/−</button>
            <button type="button" class="zero" data-number="0">0</button>
            <button type="button" data-action="decimal">.</button>
            <button type="button" class="operator" data-operator="+">+</button>

            <button type="button" class="equals" data-action="equals">
                Calculate&nbsp; =
            </button>

        </section>

        <footer class="footer">
            <span>MADE FOR YOU</span>
            <span>HTML · CSS · JS</span>
        </footer>

    </main>

    <script>
        const resultDisplay = document.getElementById("result");
        const historyDisplay = document.getElementById("history");

        let expression = "";
        let justCalculated = false;

        function updateDisplay() {
            resultDisplay.textContent = expression
                ? expression.replace(/\*/g, "×").replace(/\//g, "÷")
                : "0";
        }

        function addNumber(number) {
            if (justCalculated) {
                expression = "";
                historyDisplay.textContent = "";
                justCalculated = false;
            }

            if (expression.length < 100) {
                expression += number;
            }

            updateDisplay();
        }

        function addOperator(operator) {
            if (justCalculated) {
                historyDisplay.textContent = "";
                justCalculated = false;
            }

            if (!expression) {
                if (operator === "-") expression = "-";
                updateDisplay();
                return;
            }

            if (/[+\-*/.]$/.test(expression)) {
                expression = expression.slice(0, -1);
            }

            expression += operator;
            updateDisplay();
        }

        function addDecimal() {
            if (justCalculated) {
                expression = "";
                historyDisplay.textContent = "";
                justCalculated = false;
            }

            const lastNumber = expression.split(/[+\-*/()]/).pop();

            if (lastNumber.includes(".")) return;

            if (!lastNumber) expression += "0";

            expression += ".";
            updateDisplay();
        }

        function clearAll() {
            expression = "";
            justCalculated = false;
            historyDisplay.textContent = "";
            updateDisplay();
        }

        function deleteLast() {
            expression = expression.slice(0, -1);
            justCalculated = false;
            updateDisplay();
        }

        function toggleSign() {
            if (!expression) {
                expression = "-";
            } else if (expression.startsWith("-")) {
                expression = expression.slice(1);
            } else {
                expression = "-" + expression;
            }

            justCalculated = false;
            updateDisplay();
        }

        function addBracket() {
            if (justCalculated) {
                expression = "";
                justCalculated = false;
            }

            const opens = (expression.match(/\(/g) || []).length;
            const closes = (expression.match(/\)/g) || []).length;

            if (!expression || /[+\-*/(]$/.test(expression)) {
                expression += "(";
            } else if (opens > closes) {
                expression += ")";
            } else {
                expression += "*(";
            }

            updateDisplay();
        }

        function addPercent() {
            const match = expression.match(/(?:\d+\.?\d*|\.\d+)$/);

            if (!match) return;

            const number = Number(match[0]);

            expression = expression.slice(0, -match[0].length)
                + String(number / 100);

            updateDisplay();
        }

        // A restricted parser calculates expressions without eval().
        function calculate(input) {
            const tokens = input.match(
                /\d*\.?\d+|[()+\-*/]/g
            );

            if (!tokens || tokens.join("") !== input) {
                throw new Error("Invalid expression");
            }

            let position = 0;

            function parseExpression() {
                let value = parseTerm();

                while (
                    tokens[position] === "+" ||
                    tokens[position] === "-"
                ) {
                    const operator = tokens[position++];
                    const right = parseTerm();

                    value = operator === "+"
                        ? value + right
                        : value - right;
                }

                return value;
            }

            function parseTerm() {
                let value = parseFactor();

                while (
                    tokens[position] === "*" ||
                    tokens[position] === "/"
                ) {
                    const operator = tokens[position++];
                    const right = parseFactor();

                    if (operator === "/" && right === 0) {
                        throw new Error("Cannot divide by zero");
                    }

                    value = operator === "*"
                        ? value * right
                        : value / right;
                }

                return value;
            }

            function parseFactor() {
                const token = tokens[position];

                if (token === "+") {
                    position++;
                    return parseFactor();
                }

                if (token === "-") {
                    position++;
                    return -parseFactor();
                }

                if (token === "(") {
                    position++;

                    const value = parseExpression();

                    if (tokens[position] !== ")") {
                        throw new Error("Missing bracket");
                    }

                    position++;
                    return value;
                }

                if (token && /^\d*\.?\d+$/.test(token)) {
                    position++;
                    return Number(token);
                }

                throw new Error("Invalid expression");
            }

            const answer = parseExpression();

            if (
                position !== tokens.length ||
                !Number.isFinite(answer)
            ) {
                throw new Error("Invalid calculation");
            }

            return answer;
        }

        function showResult() {
            if (!expression) return;

            try {
                const original = expression;
                const answer = calculate(expression);

                historyDisplay.textContent =
                    original.replace(/\*/g, "×").replace(/\//g, "÷")
                    + " =";

                expression = String(Number(answer.toPrecision(12)));
                justCalculated = true;

                updateDisplay();

            } catch (error) {
                historyDisplay.textContent =
                    "Invalid expression — try again";

                resultDisplay.textContent = "Error";
                expression = "";
                justCalculated = true;
            }
        }

        document.querySelectorAll("[data-number]").forEach(button => {
            button.addEventListener("click", () => {
                addNumber(button.dataset.number);
            });
        });

        document.querySelectorAll("[data-operator]").forEach(button => {
            button.addEventListener("click", () => {
                addOperator(button.dataset.operator);
            });
        });

        document.querySelectorAll("[data-action]").forEach(button => {
            button.addEventListener("click", () => {
                switch (button.dataset.action) {
                    case "clear":
                        clearAll();
                        break;

                    case "delete":
                        deleteLast();
                        break;

                    case "decimal":
                        addDecimal();
                        break;

                    case "bracket":
                        addBracket();
                        break;

                    case "percent":
                        addPercent();
                        break;

                    case "sign":
                        toggleSign();
                        break;

                    case "equals":
                        showResult();
                        break;
                }
            });
        });

        document.addEventListener("keydown", event => {
            if (/^\d$/.test(event.key)) {
                addNumber(event.key);
            } else if (["+", "-", "*", "/"].includes(event.key)) {
                addOperator(event.key);
            } else if (event.key === ".") {
                addDecimal();
            } else if (event.key === "Enter" || event.key === "=") {
                event.preventDefault();
                showResult();
            } else if (event.key === "Backspace") {
                deleteLast();
            } else if (event.key === "Escape") {
                clearAll();
            }
        });
    </script>

</body>
</html>
